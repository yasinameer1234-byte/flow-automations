{% extends "base.html" %}
{% block title %}Sign in · Flow Automations{% endblock %}
{% block body %}
<div class="login">
  <h1>Sign in</h1>
  <p class="sub">Flow Automations dashboard</p>
  {% if error %}<p class="badge bad" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Email <input name="email" type="email" required autocomplete="username" style="width:100%"></label>
    <label>Password <input name="password" type="password" required autocomplete="current-password" style="width:100%"></label>
    <button class="primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
